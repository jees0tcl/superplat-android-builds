<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SuperPlat Android Build 다운로드</title>
<!--
  GitHub Pages 용 입구 페이지. 실제 다운로드 페이지는 사내 NAS(http://192.168.0.75/superplat-mobile/)에 있다.
  왜 바로 APK 링크를 두지 않나: Pages 는 https 이고 NAS 는 http 라, https 페이지에서 http 파일(APK)을 받는 것은
  Chrome 이 '안전하지 않은 다운로드'로 막는다. 페이지 자체를 http 인 NAS 페이지로 넘기면 그 안의 APK 버튼은 같은 http 라 정상 동작한다.
  이 파일은 빌드가 바뀌어도 수정할 필요가 없다.
-->
<style>
  :root { --bg:#0f1218; --fg:#e8ecf3; --muted:#9aa3b2; --accent:#4f8cff; --line:#2a3140; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 16px/1.6 -apple-system, "Segoe UI", "Noto Sans KR", Roboto, sans-serif; padding: 28px max(16px, env(safe-area-inset-left)) 48px max(16px, env(safe-area-inset-right)); }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin-bottom: 24px; }
  a.btn { display: block; text-align: center; text-decoration: none; color: #fff; background: var(--accent); border-radius: 12px; padding: 18px; font-size: 20px; font-weight: 700; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>SuperPlat Android Build 다운로드</h1>
  <div class="sub">사내 테스트용. 사내 Wi-Fi에서만 받을 수 있습니다.</div>
  <a class="btn" href="http://192.168.0.75/superplat-mobile/">APK 받기</a>
  <div class="hint">사내 NAS 페이지로 이동합니다. 자동으로 넘어가지 않으면 버튼을 눌러 주세요.</div>
</main>
<script>
  // 사내 Wi-Fi 라면 바로 NAS 페이지로. 밖이면 연결이 안 되고 브라우저가 오류를 보여 준다.
  setTimeout(function () { location.replace("http://192.168.0.75/superplat-mobile/"); }, 300);
</script>
</body>
</html>
